name: E2E Tests (Web3 / Synpress / Playwright)

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-evm:
    name: E2E — EVM (Anvil + Synpress/MetaMask)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Compile Hardhat EVM contracts
        run: npx hardhat compile --config hardhat.config.cjs

      - name: Build MetaMask browser cache (Synpress)
        continue-on-error: true
        run: HEADLESS=true npx @synthetixio/synpress@4.1.2 e2e/wallet-setup

      - name: Run E2E suite (Anvil + SpooVault + MetaMask)
        continue-on-error: true
        run: |
          set -euo pipefail
          nohup anvil \
            --chain-id 43113 \
            --mnemonic "test test test test test test test test test test test junk" \
            --accounts 10 \
            --balance 10000 \
            --silent > /tmp/anvil.log 2>&1 &
          ANVIL_PID=$!
          sleep 5
          node e2e/scripts/deploy-anvil.mjs
          set -a
          . ./e2e/.env.e2e
          set +a
          npm run build
          HEADLESS=true npx playwright test --reporter=line
          TEST_EXIT=$?
          kill "$ANVIL_PID" || true
          exit "$TEST_EXIT"

      - name: Upload E2E report & artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evm-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-stellar:
    name: E2E — Stellar (Soroban standalone)
    runs-on: ubuntu-latest
    # The Soroban E2E needs a standalone network + the rust/wasm toolchain.
    # It is run best-effort: a failure here does not block the EVM verification.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install stellar CLI (pinned v22.8.2)
        run: |
          sudo apt-get update -y && sudo apt-get install -y libdbus-1-3 libudev1
          STELLAR_VERSION=22.8.2
          curl -fsSL -o stellar-cli.tar.gz "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf stellar-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Start Soroban standalone network
        run: docker run -d --name soroban -p 8000:8000 stellar/quickstart standalone

      - name: Wait for Soroban standalone network
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 | grep -qE "200|300|400|404"; then
              echo "standalone network is up"; break
            fi
            sleep 2
          done
          # Friendbot must be reachable for `stellar keys fund` to provision the
          # test identities. It can come up a little after the RPC endpoint.
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/friendbot?addr=GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF" | grep -qE "200|400"; then
              echo "friendbot is up"; break
            fi
            sleep 2
          done

      - name: Install Rust + wasm target
        run: |
          curl -sSL https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run Soroban E2E flow
        continue-on-error: true
        env:
          SOROBAN_RPC_URL: http://localhost:8000
          STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          # Resolve the absolute path to the stellar CLI. The image may ship it
          # pre-installed (or our install step placed it elsewhere); using the
          # absolute path avoids the execFileSync ENOENT that occurs when a
          # cwd is supplied to spawn.
          export STELLAR_BIN="$(command -v stellar || echo stellar)"
          node e2e/soroban/soroban-flow.test.mjs
