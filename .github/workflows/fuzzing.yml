name: Fuzzing Suite (Echidna / Medusa / Soroban)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  echidna:
    name: Echidna (Solidity property fuzzing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (for OpenZeppelin imports)
        run: npm install --legacy-peer-deps

      # The echidna image ships solc-select but starts with no version
      # selected, so plain `echidna-test` fails before it ever reads the
      # harness ("No solc version set"). Select the same solc version the
      # rest of the repo builds with (hardhat.config.cjs) before fuzzing.
      - name: Run Echidna campaign
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            --entrypoint bash \
            trailofbits/echidna:v2.2.3 \
            -c "solc-select install 0.8.24 && solc-select use 0.8.24 && echidna-test /src/fuzz/harness/SpooVaultFuzz.sol --contract SpooVaultFuzz --config /src/fuzz/echidna/config.yaml --test-mode property"

  medusa:
    name: Medusa (Solidity invariant fuzzing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Medusa
        run: go install github.com/crytic/medusa@latest

      - name: Install dependencies (for OpenZeppelin imports)
        run: npm install --legacy-peer-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Medusa shells out to crytic-compile (a Python tool, not a Go one) to
      # compile the Solidity harness, and crytic-compile itself resolves solc
      # through solc-select. Neither is installed by default, so without this
      # step medusa fails immediately with "crytic-compile: executable file
      # not found in $PATH".
      - name: Install crytic-compile
        run: |
          pip install --upgrade pip crytic-compile solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Run Medusa campaign
        run: |
          export PATH="$HOME/go/bin:$PATH"
          medusa fuzz --config fuzz/medusa/medusa.json

  soroban-fuzz:
    name: Soroban proptest (cargo-fuzz / proptest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts-stellar/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts-stellar/Cargo.lock') }}

      - name: Format (Soroban crate)
        working-directory: contracts-stellar
        run: cargo fmt

      - name: Run Soroban contract test suite
        working-directory: contracts-stellar
        run: cargo test
