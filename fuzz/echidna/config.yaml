# Echidna campaign configuration for the SpooVault differential fuzzing suite.
# See https://github.com/crytic/echidna/wiki/Configuration
testMode: property
testLimit: 100000
seqLen: 100
corpusDir: "/tmp/echidna-corpus"
coverage: false
# Echidna will only attempt to break `echidna_*` properties.
format: text
# Increase the number of transactions attempted per fuzzing campaign.
maxFuzzSpaceSize: 100000
# Stop early if a property is violated.
stopOnFail: true
# Resolve @openzeppelin imports (from the mounted node_modules) when crytic-compile
# invokes solc directly on the harness file.
cryticArgs: ["--solc-remaps", "@openzeppelin/=node_modules/@openzeppelin/"]
# OpenZeppelin 5.x uses the MCOPY opcode, which requires the Cancun EVM target
# (matching hardhat.config.cjs). Without it, solc reports "Function mcopy not found".
solcArgs: "--evm-version cancun"
